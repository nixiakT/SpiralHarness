name: Paper

on:
  push:
    branches: [main]
    paths:
      - "paper/**"
      - "docs/iclr-2027/claim-evidence-ledger.md"
      - "docs/iclr-2027/preregistered-main-study.md"
      - "docs/iclr-2027/submission-release.yml"
      - ".github/workflows/paper.yml"
  pull_request:
    paths:
      - "paper/**"
      - "docs/iclr-2027/claim-evidence-ledger.md"
      - "docs/iclr-2027/preregistered-main-study.md"
      - "docs/iclr-2027/submission-release.yml"
      - ".github/workflows/paper.yml"
  workflow_dispatch:
    inputs:
      submission_ready:
        description: Run fail-closed submission-release checks
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: paper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ICLR 2027 pdfLaTeX gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install TeX and PDF audit tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            latexmk \
            poppler-utils \
            ripgrep \
            texlive-fonts-recommended \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-pictures
      - name: Compile and audit anonymous paper
        env:
          SUBMISSION_READY: ${{ github.event_name == 'workflow_dispatch' && inputs.submission_ready && '1' || '0' }}
        run: paper/ci/check.sh
