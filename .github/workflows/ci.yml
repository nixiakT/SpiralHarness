name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          version: 0.11.9
      - run: uv lock --check
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Run pytest with a public failure summary
        id: pytest
        run: uv run pytest --cov --junitxml=pytest-results.xml
      - name: Publish pytest failure annotations
        if: failure() && steps.pytest.outcome == 'failure'
        run: uv run python tools/report_junit_failures.py pytest-results.xml
      - run: uv build
      - run: uv run python tools/verify_wheel.py dist
